server:
  port: 8080

spring:
  application:
    name: SpringBootEcomV1

  h2:
    console:
      enabled: true
      path: /h2-console

  datasource:
    url: jdbc:h2:mem:ecomdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  spring:
    sql:
      init:
        mode: always
    jpa:
      defer-datasource-initialization: true
      hibernate:
        ddl-auto: create-drop
        show-sql: true
        properties:
          hibernate:
            format_sql: true

    logging:
      level:
        org.hibernate.SQL: debug # Prints the SQL statements
        org.hibernate.type.descriptor.sql.BasicBinder: trace # Prints the parameter values passed into queries